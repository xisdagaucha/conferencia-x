<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;background:#f3f4f2}
img{max-width:100%}[hidden]{display:none!important}
#cx-gate{position:fixed;inset:0;z-index:50;background:#0e100e;color:#f2f4f2;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.cxg-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.cxg-logo{width:150px;height:auto;align-self:center;border-radius:24px}
.cxg-title{font-family:"Archivo Black","Arial Black",sans-serif;font-size:28px;text-transform:uppercase}
.cxg-title em{font-style:normal;color:#28c850}
.cxg-sub{margin:0;color:#aab3ab;font-size:14px;line-height:1.45}
#cxg-form{display:flex;flex-direction:column;gap:12px;text-align:left}
#cxg-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#aab3ab}
#cxg-form input{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid #2e352e;background:#181c18;color:#fff;text-transform:none;letter-spacing:0}
#cxg-form button{font:inherit;font-weight:800;font-size:16px;padding:14px;border-radius:12px;border:0;background:#28c850;color:#07110a;cursor:pointer}
#cxg-form button:disabled{opacity:.6}
.cxg-err{color:#f08b82;min-height:18px;margin:0;font-weight:700;font-size:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="adapter.js"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface2:#f7f8f6; --ink:#111411; --muted:#596159; --line:#dce0da;
  --erva:#28c850; --erva-ink:#07110a; --erva-soft:#e0f6e6; --erva-text:#12762e;
  --brasa:#d9730f; --brasa-soft:#fdeedb; --brasa-text:#9c4f08;
  --warn:#96600f; --warn-soft:#fbefd6;
  --bad:#b0271f; --bad-soft:#fbe3e0;
  --shadow:0 1px 2px rgba(10,20,12,.05),0 2px 8px rgba(10,20,12,.04);
  --bar:#0e100e; --bar-ink:#f2f4f2;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0e0c; --surface:#151815; --surface2:#1b1f1b; --ink:#edf1ed; --muted:#9aa39a; --line:#283028;
    --erva:#2fd35a; --erva-ink:#06100a; --erva-soft:#15321f; --erva-text:#63e087;
    --brasa:#f0923a; --brasa-soft:#382411; --brasa-text:#f5a960;
    --warn:#e3b35c; --warn-soft:#352914;
    --bad:#f08b82; --bad-soft:#3b1d1a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bg:#0c0e0c; --surface:#151815; --surface2:#1b1f1b; --ink:#edf1ed; --muted:#9aa39a; --line:#283028;
    --erva:#2fd35a; --erva-ink:#06100a; --erva-soft:#15321f; --erva-text:#63e087;
    --brasa:#f0923a; --brasa-soft:#382411; --brasa-text:#f5a960;
    --warn:#e3b35c; --warn-soft:#352914;
    --bad:#f08b82; --bad-soft:#3b1d1a;
    --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--erva);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.brandbar{background:var(--bar);color:var(--bar-ink);margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--erva)}
.brandbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:62px;width:auto;display:block}
.brand .sub{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;color:var(--bar-ink);border-left:2px solid #2e352e;padding-left:14px}
.brand .sub small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.02em;text-transform:none;color:#9aa39a;font-weight:500}
.brand .appname{display:block;font-size:18px;letter-spacing:.03em}
.brand .appname em,.login-brand em{font-style:normal;color:#28c850}
.isda{font-style:normal;font-family:var(--body);font-weight:700;text-transform:none;font-size:.62em;color:#28c850;letter-spacing:0;margin-left:1px}
.login-brand .isda{font-size:.55em}
.nw{white-space:nowrap}
.login-brand{font-family:var(--display);font-size:30px;text-align:center;text-transform:uppercase;line-height:1.1}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.who .nm{font-weight:700;font-size:14px;color:var(--bar-ink)}
.who .out{background:transparent;border:1px solid #3a423a;color:var(--bar-ink);border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px}
.who .out:hover{border-color:#28c850}
.login{max-width:440px;margin:8px auto 0;display:flex;flex-direction:column;gap:16px}
.login h2{font-size:20px;text-transform:uppercase;text-align:center}
.bigpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigpick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;box-shadow:var(--shadow);color:var(--ink)}
.bigpick button svg{width:30px;height:30px;color:var(--erva-text)}
.bigpick button:hover{border-color:var(--erva)}
.dots{display:flex;justify-content:center;gap:14px;margin:4px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:24px;color:var(--ink);box-shadow:var(--shadow)}
.keypad button.sm{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted)}
.keypad button.ok{background:var(--erva);border-color:var(--erva);color:var(--erva-ink);font-size:16px}
.keypad button:disabled{opacity:.45}
.keypad button:active{background:var(--erva);color:var(--erva-ink)}
.err{color:var(--bad);font-weight:700;text-align:center;min-height:20px;margin:0}
.backlink{border:0;background:transparent;color:var(--muted);font-weight:700;text-decoration:underline;align-self:center;padding:8px}
.acc-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.acc-row:last-child{border-bottom:0}
.acc-row input{width:90px!important;min-height:40px!important;text-align:center;letter-spacing:.2em;font-weight:700}
.pinv{font-family:var(--display);letter-spacing:.15em;min-width:64px;text-align:center}
@media (max-width:520px){.acc-row{grid-template-columns:1fr auto}.acc-row .t{grid-column:1/-1}}
.role{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:#28c850;color:#07110a}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;padding-block:14px 14px;margin-bottom:6px}
.tabs.two{grid-template-columns:1fr 1fr}
.tabs.three{grid-template-columns:1fr 1fr 1fr}
.tabs.three .tab{min-height:64px;font-size:14px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:74px;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.15;text-align:center;box-shadow:var(--shadow);transition:transform .08s ease,background .15s ease}
.tabs.two .tab{flex-direction:row;min-height:64px;font-size:16px;gap:10px}
.tab svg{width:24px;height:24px;flex:none;color:var(--erva-text)}
.tab:hover{border-color:var(--erva)}
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:var(--erva);border-color:var(--erva);color:var(--erva-ink)}
.tab[aria-selected="true"] svg{color:var(--erva-ink)}
@media (max-width:520px){.tabs:not(.two):not(.three){grid-template-columns:repeat(4,1fr);gap:5px}.tabs:not(.two):not(.three) .tab{min-height:62px;font-size:10.5px;padding:7px 1px;gap:4px;border-radius:12px}.tabs:not(.two) .tab{min-height:62px}.tab svg{width:22px;height:22px}}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 16px;min-height:46px;font-weight:700;color:var(--ink)}
.pick button:hover{border-color:var(--erva)}
.pick button[aria-pressed="true"]{background:var(--erva);border-color:var(--erva);color:var(--erva-ink)}

.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:18px;text-transform:uppercase}
.panel-b{padding:14px 16px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--erva);color:var(--erva-ink)}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}

.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--erva);border-radius:99px}
.count{font-family:var(--display);font-size:16px}

.phase{padding-block:6px 2px}
.phase + .phase{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:600}
.row .meta{font-size:12.5px;color:var(--muted)}
.check{flex:none;width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{width:20px;height:20px;opacity:0}
.check[aria-pressed="true"]{background:var(--erva);border-color:var(--erva);color:var(--erva-ink)}
.check[aria-pressed="true"] svg{opacity:1}
.row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.val{display:flex;gap:6px;align-items:center;margin-top:6px}
.val input{width:96px;min-height:36px;padding:6px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;min-height:38px}
.btn.primary{background:var(--erva);border-color:var(--erva);color:var(--erva-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.status{display:flex;gap:4px;flex:none}
.status button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);min-width:52px}
.status button.ok[aria-pressed="true"]{background:var(--erva);border-color:var(--erva);color:var(--erva-ink)}
.status button.pouco[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.status button.falta[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--erva-soft);color:var(--erva-text);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.me{background:var(--brasa-soft);color:var(--brasa-text);border-color:transparent}

.clean{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.ccard.mine{border-color:var(--brasa);background:var(--brasa-soft)}
.ccard .t{font-weight:700;font-size:16px}
.ccard .cday{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ccard.atrasado{border-color:var(--bad);background:var(--bad-soft)}
.edit-area{border-bottom:1px solid var(--line);padding-block:6px}
.edit-row.area1{grid-template-columns:130px 1fr 100px 130px auto;padding-block:2px}
.edit-row.area2{grid-template-columns:1fr 1fr 1fr 1fr;padding-block:2px}
@media (max-width:620px){.edit-row.area1{grid-template-columns:1fr 1fr 1fr auto}.edit-row.area1 input{grid-column:1/-1;grid-row:1}.edit-row.area2{grid-template-columns:1fr}}

.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.list-inline{display:flex;flex-wrap:wrap;gap:6px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.when{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.cur td{background:var(--erva-soft)}

.edit-row{display:grid;grid-template-columns:1fr auto auto;}
.edit-row.cfg-item{grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding-block:6px}
.edit-row.task{grid-template-columns:1fr 130px 100px 120px auto auto}
.edit-row.emp{grid-template-columns:1fr 100px 120px 100px 150px auto auto}
.edit-row select{min-height:40px;padding:6px 8px}
.edit-row input[type=text]{min-height:40px;padding:6px 10px}
.repo-row{flex-wrap:wrap}
.catbar{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;margin-inline:-2px;scrollbar-width:thin}
.catbar button{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap}
.catbar button b{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--brasa);color:#fff;font-size:12px}
.catbar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.repo-cat{margin-top:16px}
.cat-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:0 2px 0 var(--erva)}
.cat-h span:first-child{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.cat-n{font-size:12px;font-weight:700;color:var(--erva)}
.repo-row .txt{flex:1 1 150px}
.pair{display:flex;gap:10px;flex:none;margin-left:auto}
.stp{display:flex;flex-direction:column;align-items:center;gap:3px}
.stp>span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stp-box{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--surface2);overflow:hidden}
.stp-box button{width:36px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;padding:0}
.stp-box button svg{width:18px;height:18px}
.stp-box button:active{background:var(--line)}
.qty{width:52px!important;min-height:42px!important;padding:4px 2px!important;text-align:center;font-weight:800;border:0!important;border-inline:1px solid var(--line)!important;border-radius:0!important;background:transparent!important}
.stp-box.has{border-color:var(--brasa);background:var(--brasa-soft)}
.stp-box.has .qty{color:var(--brasa-text)}
.stp-box.has-tem{border-color:var(--erva);background:var(--erva-soft)}
.stp-box.has-tem .qty{color:var(--erva-text)}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.howto div{display:flex;flex-direction:column;padding:8px 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--line)}
.howto b{font-size:13px}.howto span{font-size:12.5px;color:var(--muted)}
.howto div:first-child b{color:var(--erva-text)}.howto div:last-child b{color:var(--brasa-text)}
table.mini{font-size:13.5px}table.mini th,table.mini td{padding:6px 8px}
.sug{color:var(--brasa-text);font-weight:600}
@media (max-width:420px){.qty{width:44px!important}.stp-box button{width:32px}.row .t{font-size:14px}}
table.grid{font-size:13px;border-collapse:separate;border-spacing:0}
table.grid th,table.grid td{padding:6px 4px;text-align:center;min-width:26px;border-bottom:1px solid var(--line)}
table.grid th.sticky,table.grid td.sticky{position:sticky;left:0;background:var(--surface);text-align:left;min-width:170px;padding-left:12px;z-index:1;border-right:1px solid var(--line)}
table.grid td.ok{color:var(--erva-text);font-weight:800;background:var(--erva-soft)}
table.grid td.miss{color:var(--muted)}
table.grid .closed{background:var(--surface2);color:var(--muted)}
table.grid th.today{background:var(--ink);color:var(--bg);border-radius:6px 6px 0 0}
.sheet-wrap{overflow-x:auto;background:#d9ddd8;padding:14px}
.sheet-wrap .sheet{box-shadow:0 2px 10px rgba(0,0,0,.18);margin:0 auto}
.sheet-wrap .sheet+.sheet{margin-top:16px}
.modal[hidden],.tabs[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);border-radius:14px;overflow:hidden;max-width:min(720px,100%);max-height:100%;display:flex;flex-direction:column}
.mbox img{display:block;max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;background:#000}
.mcap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px}
.fbtn{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:4px 10px;font-size:12.5px}
.fbtn svg{width:16px;height:16px}
.btn.cam{display:inline-flex;align-items:center;justify-content:center;min-height:46px;font-size:15px}
.edit-row.catrow{grid-template-columns:1fr auto auto auto auto}
.notice.catdel{margin-block:4px 10px}
.cfg-cat{margin-top:14px}
.cfg-cat .cat-h{margin-bottom:4px}
.cat-add{background:var(--erva);border-color:var(--erva);color:var(--erva-ink);min-height:32px;padding:4px 12px}
.edit-row.cfg-item{grid-template-columns:1fr 170px auto!important}
@media (max-width:520px){.edit-row.cfg-item{grid-template-columns:1fr 1fr auto!important}.edit-row.cfg-item input{grid-column:1/-1}}
table.ideal td{padding:4px 3px}
table.ideal input{width:58px;min-height:38px;padding:4px;text-align:center;font-weight:700}
table.ideal input.wide{width:104px;font-weight:600}
table.ideal td.sticky{font-weight:600;font-size:13px;white-space:normal;min-width:150px}
.ideal-m{color:var(--erva-text)!important}
.needbox{display:inline-flex;align-items:baseline;gap:8px;margin:6px 0 2px;padding:6px 12px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:inset 0 -3px 0 var(--erva)}
.needbox span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.needbox b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1;color:var(--erva)}
.row.done .needbox{opacity:.55}
.edit-row.lj-row{grid-template-columns:1fr 1fr 1fr 1fr auto}
@media (max-width:520px){.edit-row.lj-row{grid-template-columns:1fr 1fr}.edit-row.lj-row button{grid-column:1/-1}}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-weight:600}
.mod input{width:22px;height:22px;flex:none}
.meter{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--erva);border-radius:99px}
.kpi{display:flex;flex-direction:column;gap:4px;min-width:110px}
.kpi b{font-family:var(--display);font-weight:400;font-size:18px}
.kpi small,.ktile small{color:var(--muted);font-size:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ktile{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2)}
.ktile span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ktile b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
table.rel td{vertical-align:middle}
.fcell{width:44px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-family:var(--display);font-size:16px;color:var(--ink)}
.fcell.on{background:var(--erva);border-color:var(--erva);color:var(--erva-ink)}
table.folg td{padding:4px}
table.folg tfoot td{border-top:2px solid var(--line)}
.folga-me{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--erva-soft);color:var(--erva-text);font-size:14px}
.niver-hoje{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:12px;background:var(--erva);color:var(--erva-ink)}
.niver-hoje b{font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase}
.niver-hoje span{font-size:13px}
.niver-mes{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.nm-hoje{padding:8px 10px;border-radius:8px;background:var(--erva);color:var(--erva-ink);font-size:14px;margin-bottom:4px}
.nb{position:relative;overflow:hidden;border-radius:16px;padding:16px;color:#07110a;background:#28c850;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.55) 0 3px,transparent 4px),radial-gradient(circle at 82% 12%,rgba(14,16,14,.35) 0 3px,transparent 4px),radial-gradient(circle at 68% 78%,rgba(255,255,255,.5) 0 4px,transparent 5px),radial-gradient(circle at 30% 88%,rgba(255,214,90,.9) 0 3px,transparent 4px),radial-gradient(circle at 92% 55%,rgba(255,214,90,.9) 0 3px,transparent 4px),radial-gradient(circle at 48% 30%,rgba(14,16,14,.25) 0 2px,transparent 3px);
  background-size:180px 140px;box-shadow:0 4px 0 #0e100e;display:flex;flex-direction:column;gap:12px}
.nb-head{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1.05}
.nb-list{display:flex;flex-direction:column;gap:8px}
.nb-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;color:#0e100e}
.nb-item.past{opacity:.6}
.nb-item.today{background:#0e100e;color:#fff}
.nb-date{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;height:52px;border-radius:10px;background:#0e100e;color:#28c850;line-height:1}
.nb-item.today .nb-date{background:#28c850;color:#0e100e}
.nb-date b{font-family:var(--display);font-weight:400;font-size:24px}
.nb-date span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:inherit}
.nb-name{flex:1;font-weight:800;font-size:18px}
.nb-name small{display:block;font-size:12px;font-weight:600;opacity:.7}
.nb-pill{background:#ffd65a;color:#0e100e;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;text-transform:uppercase}
.nb-eu,.nb-hoje{background:#0e100e;color:#fff;border-radius:14px;padding:14px}
.nb-eu p,.nb-hoje p{margin:6px 0 0;font-size:14px;opacity:.9}
.nb-tag{display:inline-block;background:#ffd65a;color:#0e100e;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;text-transform:uppercase;margin-bottom:6px}
.nb-big{font-family:var(--display);font-size:24px;line-height:1.1;text-transform:uppercase;color:#28c850}
.x{border:0;background:transparent;color:var(--bad);font-size:20px;width:36px;height:36px;border-radius:8px}
@media (max-width:620px){
  .edit-row.task{grid-template-columns:1fr 1fr;}
  .edit-row.emp{grid-template-columns:1fr 1fr auto}
  .edit-row.emp input[type=text]{grid-column:1/-1}
  .edit-row.task input[type=text]{grid-column:1/-1}
}
.notice{padding:12px 14px;border-radius:10px;background:var(--brasa-soft);color:var(--ink);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.empty{padding:18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
.dirtybar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;gap:12px;align-items:center;background:#0e100e;color:#fff;padding:10px 12px 10px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:700;max-width:calc(100% - 32px)}
@media print{.dirtybar{display:none}}
.chipbtn{cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;border:1px solid transparent;min-height:34px}
.chipbtn.ok{background:var(--erva);color:var(--erva-ink);border-color:var(--erva)}
</style>

function fmtTime(iso){if(!iso)return '';return new Date(iso).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'})}
function storeName(id){const s=STORES.find(x=>x.id===id);return s?s.name+' · '+s.city:id}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function pct(a,b){return b?Math.round(a*100/b):0}
function bar(a,b){return `<div class="progress"><div class="bar"><i style="width:${pct(a,b)}%"></i></div><span class="count num">${a}/${b}</span></div>`}

function curKeys(){const d=bizDate();const w=mondayOf(d);return {date:d,week:w,wk:weekIdx(w)}}
function turnosOf(store){const c=S.cfg[store];return (c&&c.turnos&&c.turnos.length)?c.turnos:['noite']}
function matchTurno(x,t){return !x||x==='todos'||x===t}
// Domingo: só abre à noite, então manhã e noite viram um turno só
function juntaDomingo(store,date){return turnosOf(store).length>1&&new Date((date||S.keys.date)+'T00:00:00Z').getUTCDay()===0}
function turnosHoje(store,date){return juntaDomingo(store,date)?['noite']:turnosOf(store)}
function mT(x,tn,store,date){if(matchTurno(x,tn))return true;return juntaDomingo(store,date)&&tn==='noite'&&x==='manha'}
const PASSAGEM=/passar o (turno|caixa)|recebido da manhã|que a manhã deixou/i;
function tarefaDia(t,tn,store,date){return mT(t.turno,tn,store,date)&&!(juntaDomingo(store,date)&&PASSAGEM.test(t.title||''))}

async function compress(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    let max=1000,q=0.7,out='';
    for(let k=0;k<6;k++){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
      const cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);
      cx.font='bold '+Math.round(cv.width/32)+'px Arial';const stamp=new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+' · '+(S.me||'');const tw=cx.measureText(stamp).width;
      cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(0,cv.height-Math.round(cv.width/32)*1.9,tw+24,Math.round(cv.width/32)*1.9);cx.fillStyle='#fff';cx.fillText(stamp,12,cv.height-Math.round(cv.width/32)*0.6);
      out=cv.toDataURL('image/jpeg',q);if(out.length<230000)break;max=Math.round(max*0.8);q=Math.max(0.45,q-0.08)}
    return out}finally{URL.revokeObjectURL(url)}
}

// ---------- dias da limpeza ----------
const DIAS=[[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta'],[6,'Sábado'],[0,'Domingo'],[1,'Segunda']];
function diaNome(d){const x=DIAS.find(z=>z[0]===+d);return x?x[1]:'Qualquer dia'}
function diaOrd(d){if(d===''||d==null)return 99;return d==0?7:+d}
function hojeDow(){return new Date(S.keys.date+'T00:00:00Z').getUTCDay()}
function dataDoDia(d){if(d===''||d==null)return null;return addDays(S.keys.week,diaOrd(d)-1)}
function areaEstado(a,r){if(r&&r.done)return 'feito';const o=diaOrd(a.dia),t=diaOrd(hojeDow());if(o===99)return 'pendente';return o<t?'atrasado':o===t?'hoje':'pendente'}
function estadoChip(a,r,store){return estadoChip0(a,r)+(store&&r&&r.done&&r.foto?fotoBtn(store,S.keys.week,a.id):'')}
function fotoBtn(store,week,aid){const nf=week===S.keys.week?((((S.week[store]||{}).areas||{})[aid]||{}).nf||1):1;return `<button class="btn small fbtn" data-act="verfoto" data-s="${store}" data-w="${week}" data-a="${aid}" aria-label="Ver ${nf>1?nf+' fotos':'foto'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${nf>1?nf+' fotos':'Foto'}</button>`}
function estadoChip0(a,r){const e=areaEstado(a,r);return e==='feito'?`<span class="chip ok" title="${h(fmtWhen(r.at))}">Limpo · ${h(r.by)} ${fmtTime(r.at)}</span>`:e==='atrasado'?'<span class="chip bad">Atrasado</span>':e==='hoje'?'<span class="chip me">Hoje</span>':'<span class="chip">Pendente</span>'}
function sortAreas(list){return list.slice().sort((a,b)=>diaOrd(a.dia)-diaOrd(b.dia))}

// ---------- rodízio ----------
function onlyList(a){return String(a.only||'').split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(Boolean)}
const REGRA_NOVA=weekIdx('2026-10-05'); // a partir desta semana: áreas exclusivas + divisão equilibrada
// ---------- folgas ----------
function semanasMes(ym){const first=ym+'-01';const [y,m]=ym.split('-').map(Number);const last=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);const out=[];for(let w=mondayOf(first);w<=last;w=addDays(w,7))out.push(w);return out}
function fkey(store,emp){return store+'_'+emp.id}
function folgaDomingo(store,emp,ym){const d=S.folgas[ym];return d&&d.dom&&d.dom[fkey(store,emp)]||''}
function isNiver(emp,date){const n=niverNorm(emp&&emp.niver);return !!n&&n===date.slice(8,10)+'/'+date.slice(5,7)}
function isFolga(store,emp,date){if(!emp)return false;if(new Date(date+'T00:00:00Z').getUTCDay()===1)return true;if(isNiver(emp,date))return true;const k=fkey(store,emp);return Object.values(S.folgas||{}).some(d=>d&&d.dom&&d.dom[k]===date)}
function proximaFolga(store,emp){const t=S.keys.date;let best='';const n=niverNorm(emp&&emp.niver);if(n){let d=t.slice(0,4)+'-'+n.slice(3)+'-'+n.slice(0,2);if(d<t)d=(+t.slice(0,4)+1)+d.slice(4);if(d<=addDays(t,40))best=d}Object.values(S.folgas||{}).forEach(d=>{const v=d&&d.dom&&d.dom[fkey(store,emp)];if(v&&v>=t&&(!best||v<best))best=v});return best}
const ROTMEMO={};let ROTSTAMP='';
function rotStamp(){return JSON.stringify([Object.keys(S.cfg).map(k=>S.cfg[k]&&((S.cfg[k].areas||[]).length+'/'+(S.cfg[k].employees||[]).length)),Object.keys(S.folgas||{}).length,JSON.stringify(S.folgas||{}).length,JSON.stringify((S.cfg[S.store]||{}).areas||[]).length])}
function rotAcum(store,wk){// limpezas de cada pessoa nas semanas anteriores (desde a regra nova), para desempatar com justiça
  if(wk<=REGRA_NOVA)return {};const st=rotStamp();if(st!==ROTSTAMP){ROTSTAMP=st;for(const k in ROTMEMO)delete ROTMEMO[k]}
  const key=store+'|'+wk;if(ROTMEMO[key])return ROTMEMO[key];
  let acc={};for(let w=REGRA_NOVA;w<wk;w++){const mk=store+'|'+(w+1);if(ROTMEMO[mk]){acc=ROTMEMO[mk];continue}const r=rotation(store,w,acc);const n=Object.assign({},acc);Object.values(r).forEach(x=>{n[x]=(n[x]||0)+1});ROTMEMO[mk]=n;acc=n}
  return acc}
function rotation(store,wk,acumIn){
  const c=S.cfg[store];const out={};if(!c)return out;
  const groups={};
  (c.areas||[]).forEach(a=>{const g=(a.turno||'todos')+'|'+fOf(a);(groups[g]=groups[g]||[]).push(a)});
  Object.keys(groups).forEach(g=>{
    const [gt,gf]=g.split('|');const pool=(c.employees||[]).filter(e=>(gt==='todos'||e.turno===gt||e.turno==='todos')&&fOf(e)===gf);
    const mon=addDays('2024-01-01',7*wk);
    if(wk<REGRA_NOVA){const dueO=a=>a.dia===''||a.dia==null?null:addDays(mon,diaOrd(a.dia)-1);const livO=(e,a)=>{const d=dueO(a);return !d||!isFolga(store,e,d)};
      const nm=n=>String(n||'').split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(Boolean);const byN=L=>(c.employees||[]).filter(e=>L.includes(e.name.trim().toLowerCase()));
      groups[g].forEach((a,i)=>{let e=pool.length?pool[(i+wk)%pool.length]:null;
        const tit=byN(nm(a.only));if(tit.length){e=tit.find(x=>livO(x,a))||byN(nm(a.reserva)).find(x=>livO(x,a))||pool.find(x=>livO(x,a))||e}
        else if(e&&!livO(e,a)){e=pool.find(x=>livO(x,a))||e}
        out[a.id]=e?e.name:'—'});return}
    const load={};pool.forEach(e=>load[e.name]=0);
    const due=a=>a.dia===''||a.dia==null?null:addDays(mon,diaOrd(a.dia)-1);const livre=(e,a)=>{const d=due(a);return !d||!isFolga(store,e,d)};
    // 1) áreas só para algumas pessoas (ex.: coifa só para o chapeiro)
    const fixed=groups[g].filter(a=>onlyList(a).length);const normal=groups[g].filter(a=>!onlyList(a).length);
    const cnt={};
    fixed.forEach(a=>{const ok=(c.employees||[]).filter(e=>onlyList(a).includes(e.name.trim().toLowerCase()));
      const key=onlyList(a).join('|');const i=cnt[key]=(cnt[key]||0);cnt[key]++;
      let e=null;for(let k=0;k<ok.length;k++){const x=ok[(i+wk+k)%ok.length];if(livre(x,a)){e=x;break}}
      if(!e){// titular de folga: vai para a reserva, revezando
        const rs=String(a.reserva||'').split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(Boolean);const rv=(c.employees||[]).filter(x=>rs.includes(x.name.trim().toLowerCase())&&livre(x,a));
        if(rv.length){const rk='r|'+rs.join('|');const j=cnt[rk]=(cnt[rk]||0);cnt[rk]++;e=rv.sort((p,q)=>(load[p.name]||0)-(load[q.name]||0))[0]&&rv[(j+wk)%rv.length]}}
      if(!e){const livres=pool.filter(x=>livre(x,a));e=livres.length?livres.sort((p,q)=>(load[p.name]||0)-(load[q.name]||0))[0]:(ok.length?ok[(i+wk)%ok.length]:(pool[0]||null))}// titular e reserva de folga (ou fora da equipe): vai para quem estiver livre
      if(!e){out[a.id]='—';return}out[a.id]=e.name;if(e.name in load)load[e.name]++});
    // 2) as outras giram toda semana, sempre para quem está com menos limpezas
    const n=pool.length;if(!n){normal.forEach(a=>out[a.id]='—');return}
    let ptr=wk%n;
    const sameDay={};groups[g].forEach(a=>{if(out[a.id])sameDay[out[a.id]+'|'+a.dia]=1});const acum=acumIn||rotAcum(store,wk);
    const extra=gt==='noite'?(c.employees||[]).filter(e=>e.turno==='manha'&&fOf(e)===gf):[];extra.forEach(e=>{if(!(e.name in load))load[e.name]=0});
    normal.forEach(a=>{const dd=due(a);const px=pool;let cand=pool.filter(e=>livre(e,a));if(!cand.length&&dd&&juntaDomingo(store,dd))cand=extra.filter(e=>livre(e,a));if(!cand.length)cand=px;const min=Math.min(...cand.map(e=>load[e.name]));
      let best=cand.filter(e=>load[e.name]===min);const semDia=best.filter(e=>!sameDay[e.name+'|'+a.dia]);if(semDia.length)best=semDia;
      const minA=Math.min(...best.map(e=>acum[e.name]||0));best=best.filter(e=>(acum[e.name]||0)===minA);
      let done=false;for(let k=0;k<n;k++){const idx=(ptr+k)%n;const e=pool[idx];if(best.includes(e)){out[a.id]=e.name;load[e.name]++;sameDay[e.name+'|'+a.dia]=1;ptr=(idx+1)%n;done=true;break}}
      if(!done&&best.length){const e=best[0];out[a.id]=e.name;load[e.name]++;sameDay[e.name+'|'+a.dia]=1}});
  });
  return out;
}

// ---------- escrita ----------
const queues={};
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p}
function write(path,exists,base,patch){
  if(!S.db){toast('Sem conexão com os dados.');return}
  return enqueue(path,async()=>{
    const ref=S.db.doc(path);
    try{
      if(exists){await ref.update(patch)}
      else{try{await ref.update(patch)}catch(e){if(e&&e.code==='invalid_argument'){await ref.set(Object.assign({},base,patch))}else throw e}}
    }catch(e){
      if(e&&e.code==='invalid_argument'){S.readOnly=true;toast('Seu acesso não permite salvar. Peça à gestora acesso de colaborador.')}
      else if(e&&e.code==='quota_exceeded'){toast('Limite de registros atingido. Avise a gestora.')}
      else toast('Não foi possível salvar. Tente de novo.');
      render();
    }
  });
}
function markTask(store,turno,task,done,val){
  const k=S.keys;const key=turno+'__'+task.id;
  const rec={done,by:S.me,at:new Date().toISOString(),title:task.title,turno};
  if(val!==undefined)rec.val=val;
  const path='days/'+store+'_'+k.date;
  // atualização otimista
  const d=S.day[store]=Object.assign({},S.day[store]||{});d.tasks=Object.assign({},d.tasks||{});d.tasks[key]=rec;render();
  write(path,S.dayExists[store],{store,date:k.date},{tasks:{[key]:rec}});
}
function numOf(v){const m=String(v==null?'':v).replace(',','.').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null}
function rTem(r){return r&&r.tem!=null?String(r.tem):''}
function rPrec(r){return r&&r.precisa!=null?String(r.precisa):(r&&r.qty!=null?String(r.qty):'')}
function hasRec(r){return rTem(r)!==''||rPrec(r)!==''}
// próximo dia aberto: segunda a loja fecha, então de domingo vai direto para terça
function proxDia(d){let x=addDays(d,1);if(new Date(x+'T00:00:00Z').getUTCDay()===1)x=addDays(x,1);return x}
function proxEhAmanha(){return proxDia(S.keys.date)===addDays(S.keys.date,1)}
function proxNome(){const x=proxDia(S.keys.date);return proxEhAmanha()?'amanhã':diaNome(new Date(x+'T00:00:00Z').getUTCDay()).toLowerCase()}
function proxBtn(){const x=proxDia(S.keys.date);const dn=diaNome(new Date(x+'T00:00:00Z').getUTCDay());return proxEhAmanha()?'Amanhã ('+dn.slice(0,3)+')':dn+' (segunda fechado)'}
function deixadoTxt(r){const d=r&&r.at?bizDate(Date.parse(r.at)):'';const dw=d?new Date(d+'T00:00:00Z').getUTCDay():-1;return d&&d!==addDays(S.keys.date,-1)&&dw===0?'🌙 Deixado no domingo por ':'🌙 Deixado na noite anterior por '}
function repoDate(){return S.repoAm?proxDia(S.keys.date):S.keys.date}
function repoDay(store){return (S.repoAm?S.dayAm[store]:S.day[store])||{}}
function idealHoje(item){if(!item)return '';const d=new Date((S.tab==='reposicao'?repoDate():S.keys.date)+'T00:00:00Z').getUTCDay();const v=item.idealDia&&item.idealDia[d];return v!=null&&v!==''?String(v):(item.ideal!=null?String(item.ideal):'')}
function calcPrec(item,tem){const t=numOf(tem),i=numOf(idealHoje(item));if(t==null||i==null)return null;const p=Math.round((i-t)*100)/100;return p>0?String(p).replace('.',','):''}
function sugerido(item,r){if(rPrec(r)!==''||!item)return null;const t=numOf(rTem(r)),i=numOf(idealHoje(item));if(t==null||i==null)return null;return Math.max(0,Math.round((i-t)*10)/10)}
function fmtN(n){return String(n).replace('.',',')}
function itemRec(items,id){let best=null;Object.keys(items||{}).forEach(k=>{if(k.endsWith('__'+id)){const r=items[k];if(r&&(!best||String(r.at||'')>String(best.at||'')))best=r}});return best||{}}
function itemsLatest(items){const m={};Object.values(items||{}).forEach(r=>{if(!r)return;const k=r.id||r.name;if(!m[k]||String(r.at||'')>String(m[k].at||''))m[k]=r});return Object.values(m)}
function markSep(store,item,on){
  const k=S.keys;const am=!!S.repoAm;const dt=am?proxDia(k.date):k.date;const box=am?S.dayAm:S.day;const key='dia__'+item.id;
  const cur=itemRec((box[store]||{}).items,item.id);const rec=Object.assign({},cur,{id:item.id,name:item.name,cat:item.cat||'',sep:!!on,sepBy:on?S.me:'',sepAt:on?new Date().toISOString():''});
  const d=box[store]=Object.assign({},box[store]||{});d.items=Object.assign({},d.items||{});d.items[key]=rec;setTimeout(render,0);
  write('days/'+store+'_'+dt,(am?S.dayAmExists:S.dayExists)[store],{store,date:dt},{items:{[key]:rec}});

function markItem(store,turno,item,tem,precisa){

function subscribe(){

  S.subs.push(S.db.doc('config/lojas').onSnapshot(snap=>{const L=snap.exists&&Array.isArray(snap.data().stores)&&snap.data().stores.length?snap.data().stores:STORES_PADRAO;
    if(JSON.stringify(L)!==JSON.stringify(STORES)){const added=L.some(x=>!STORES.some(y=>y.id===x.id));STORES=L.map(x=>Object.assign({},x));if(!STORES.some(x=>x.id===S.store))S.store=STORES[0].id;if(added){setTimeout(subscribe,0);return}}
    S.lojasLoaded=true;render()},onErr));
  S.subs.push(S.db.doc('config/acesso').onSnapshot(snap=>{S.acc=snap.exists?snap.data():null;S.accLoaded=true;applyAuth();if(S.auth&&expired())logout('Você saiu automaticamente por inatividade.');else render()},onErr));
  S.subs.push(S.db.doc('acesso/pins').onSnapshot(snap=>{S.pins=snap.exists?snap.data():{};render()},()=>{}));
  STORES.forEach(st=>{
    const s=st.id;
    S.subs.push(S.db.doc('config/'+s).onSnapshot(snap=>{S.cfg[s]=snap.exists?snap.data():null;S.cfgLoaded=STORES.every(x=>x.id in S.cfg);applyAuth();fixSelections();render()},onErr));
    S.subs.push(S.db.doc('days/'+s+'_'+k.date).onSnapshot(snap=>{S.dayExists[s]=snap.exists;S.day[s]=snap.exists?snap.data():{};render()},onErr));

    S.subs.push(S.db.doc('weeks/'+s+'_'+k.week).onSnapshot(snap=>{S.weekExists[s]=snap.exists;S.week[s]=snap.exists?snap.data():{};render()},onErr));
  });
}

async function hashPin(salt,p){const b=new TextEncoder().encode(String(salt)+':'+String(p));const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function expired(){const t=timeoutMin();return S.auth&&t>0&&Date.now()-(S.auth.last||0)>t*60000}

async function tryPin(){

function newSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function writeAcc(patch){

    if(!TT.some(x=>x[0]===S.tab))S.tab=TT[0][0];

}

  if(aSep.length)out+=`<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="label" style="margin-bottom:4px">Separado do estoque</div>${bar(jaSep,aSep.length)}</div><button class="btn ${S.repoSoSep?'primary':''}" data-act="reposo">${S.repoSoSep?'Mostrar todos os itens':'Ver só o que precisa separar'}</button></div>`;
  const cats=catList(c).filter(x=>its.some(i=>(i.cat||'Outros')===x&&(!S.repoSoSep||rPrec(itemRec(items,i.id))!=='')));
  const anot=cat=>its.filter(i=>(i.cat||'Outros')===cat&&hasRec(itemRec(items,i.id))).length;

  let shown=0;
  cats.forEach(cat=>{
    const list=its.filter(i=>(i.cat||'Outros')===cat&&(!S.repoSoSep||rPrec(itemRec(items,i.id))!==''));if(!list.length)return;const n=anot(cat);

      const temPrec=rPrec(r)!=='';
      out+=`<div class="row repo-row ${r.sep&&temPrec?'done':''}" data-n="${h(norm(i.name))}">${temPrec?`<button class="check" data-act="rsep" data-id="${i.id}" aria-pressed="${!!r.sep}" aria-label="Marcar ${h(i.name)} como separado">${CHECK}</button>`:''}<div class="txt"><div class="t">${h(i.name)}</div>${idealHoje(i)?`<div class="needbox"><span>Precisa ter ${am?proxNome():'hoje'}</span><b>${h(idealHoje(i))}</b></div>`:''}${r.at&&hasRec(r)?`<div class="meta">${!am&&r.antes?deixadoTxt(r):'Anotado por '}${h(r.by)}${r.turno&&turnosOf(S.store).length>1&&TURNOS[r.turno]?' ('+TURNOS[r.turno].toLowerCase()+')':''} às ${fmtTime(r.at)}</div>`:''}${r.sep&&temPrec?`<div class="meta" style="color:var(--erva-text);font-weight:700">✓ Separado por ${h(r.sepBy)} às ${fmtTime(r.sepAt)}</div>`:''}</div>

}

function storeStats(s){
  const c=S.cfg[s];if(!c)return null;const day=S.day[s]||{};const t=day.tasks||{};const it=day.items||{};
  const per=[];
  turnosHoje(s).forEach(tn=>{
    const inT=(c.employees||[]).filter(e=>mT(e.turno,tn,s)&&!isGestorF(e));const fs=[...new Set(inT.map(fOf))].sort();if(inT.some(e=>e.lider))fs.push('lider');
    (fs.length?fs:['cozinha']).forEach(f=>{
      const list=(c.tasks||[]).filter(x=>tarefaDia(x,tn,s)&&matchF(fOf(x),f));if(!list.length)return;
      const d=list.filter(x=>(t[tn+'__'+x.id]||{}).done);const pend=list.filter(x=>!(t[tn+'__'+x.id]||{}).done);
      per.push({tn,f,done:d.length,total:list.length,pend});
    });
  });
  const need=[];const order=(c.items||[]).map(i=>i.name);
  const byId={};(c.items||[]).forEach(i=>byId[i.id]=i);
  itemsLatest(it).forEach(r=>{if(hasRec(r)){const item=byId[r.id]||(c.items||[]).find(i=>i.name===r.name);need.push(Object.assign({},r,{sug:sugerido(item,r),ideal:idealHoje(item)}))}});
  need.sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));
  const rot=rotation(s,S.keys.wk);const wk=(S.week[s]||{}).areas||{};
  const areas=sortAreas(c.areas||[]);const aDone=areas.filter(a=>(wk[a.id]||{}).done);
  return {per,need,areas,aDone,rot,wk};
}

function folEmps(storeSel){const L=[];STORES.forEach(st=>{if(storeSel!=='todas'&&st.id!==storeSel)return;((S.cfg[st.id]||{}).employees||[]).filter(e=>!isGestorF(e)).forEach(e=>L.push({st:st.id,e}))});return L.sort((a,b)=>a.e.name.localeCompare(b.e.name,'pt-BR'))}

// ---------- relatórios ----------
function relRange(){const R=S.rel;const t=S.keys.date;
  if(R.per==='7')return [addDays(t,-6),t];
  if(R.per==='30')return [addDays(t,-29),t];
  if(R.per==='mes')return [t.slice(0,8)+'01',t];
  if(R.per==='mesant'){const [y,m]=t.split('-').map(Number);const d=new Date(Date.UTC(y,m-2,1));const a=d.toISOString().slice(0,10);const e=new Date(Date.UTC(y,m-1,0)).toISOString().slice(0,10);return [a,e]}
  return [R.a||addDays(t,-6),R.b||t]}
function pctTxt(a,b){return b?Math.round(a*100/b)+'%':'—'}
function meter(a,b){const p=b?Math.round(a*100/b):0;return `<div class="meter" title="${a} de ${b} (${pctTxt(a,b)})"><i style="width:${p}%"></i></div>`}
async function loadRel(){
  const [a,b]=relRange();const R=S.rel;const key=R.store+'|'+a+'|'+b;R.key=key;R.data=null;
  const stores=R.store==='todas'?STORES.map(x=>x.id):[R.store];const out={};
  try{for(const s of stores){
      const dq=await S.db.collection('days').where('store','==',s).where('date','>=',a).where('date','<=',b).limit(400).get();
      const days={};dq.docs.forEach(d=>{const x=d.data();days[x.date]=x});
      const wq=await S.db.collection('weeks').where('store','==',s).where('week','>=',mondayOf(a)).where('week','<=',b).limit(80).get();
      const weeks={};wq.docs.forEach(d=>{const x=d.data();weeks[x.week]=x});
      out[s]=calcRel(s,a,b,days,weeks);
    }}catch(e){toast('Não foi possível gerar o relatório.');R.err=true}
  if(S.rel.key!==key)return;R.data=out;render();
}
function calcRel(s,a,b,days,weeks){
  const c=S.cfg[s]||{};const today=S.keys.date;const end=b<today?b:today;
  const dates=[];for(let d=a;d<=end;d=addDays(d,1)){const dow=new Date(d+'T00:00:00Z').getUTCDay();if(dow===1&&!days[d])continue;dates.push(d)}
  const R={store:s,dates,daily:[],missed:{},func:{},prodDaily:[],prodMiss:{},repo:{},people:{},clean:{},cleanTot:{due:0,done:0,prazo:0,foto:0}};
  const P=n=>R.people[n]=R.people[n]||{tarefas:0,producao:0,reposicao:0,limpezas:0};
  const tasks=c.tasks||[];
  dates.forEach(d=>{const doc=days[d]||{};const t=doc.tasks||{};let exp=0,done=0;
    turnosHoje(s,d).forEach(tn=>{const emps=(c.employees||[]).filter(e=>mT(e.turno,tn,s,d));const hasL=emps.some(e=>e.lider);
      tasks.filter(x=>tarefaDia(x,tn,s,d)&&(fOf(x)!=='lider'||hasL)).forEach(x=>{const ok=(t[tn+'__'+x.id]||{}).done;exp++;if(ok)done++;
        const f=fOf(x)==='todos'?'cozinha':fOf(x);const F=R.func[f]=R.func[f]||{exp:0,done:0};F.exp++;if(ok)F.done++;
        if(!ok){const k=x.title+(turnosOf(s).length>1?' · '+TURNOS[tn]:'');R.missed[k]=(R.missed[k]||0)+1}})});
    R.daily.push({d,exp,done,has:!!days[d]});
    Object.values(t).forEach(r=>{if(r.done&&r.by)P(r.by).tarefas++});
    const pr=doc.prod||{};const pl=(c.producao||[]).filter(p=>prodAtivo(p,d));let pd=0;pl.forEach(p=>{if(pr[p.id]&&pr[p.id].ok)pd++;else R.prodMiss[p.name]=(R.prodMiss[p.name]||0)+1});
    R.prodDaily.push({d,exp:pl.length,done:pd});Object.values(pr).forEach(r=>{if(r.ok&&r.by)P(r.by).producao++});

function viewRel(){

    <div class="field"><span class="label">Período</span>${pick('relper',R.per,[['7','Últimos 7 dias'],['30','Últimos 30 dias'],['mes','Este mês'],['mesant','Mês passado'],['custom','Escolher datas']])}</div>

  </div></section>`;

  out+=`<section class="panel"><div class="panel-h"><h2>Resumo</h2><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-act="relcsv">Baixar planilha (CSV)</button><button class="btn ghost" data-act="relhtml">Baixar para imprimir</button></div></div><div class="tablewrap"><table class="rel"><thead><tr><th>Loja</th><th>Checklist</th><th>Produção</th><th>Limpeza no prazo</th><th>Limpezas com foto</th><th>Itens pedidos</th></tr></thead><tbody>
  ${ids.map(s=>{const x=D[s];const ce=x.daily.reduce((n,d)=>n+d.exp,0),cd=x.daily.reduce((n,d)=>n+d.done,0),pe=x.prodDaily.reduce((n,d)=>n+d.exp,0),pd=x.prodDaily.reduce((n,d)=>n+d.done,0);
    return `<tr><td><b>${h(storeName(s))}</b></td><td>${kpi(cd,ce)}</td><td>${kpi(pd,pe)}</td><td>${kpi(x.cleanTot.prazo,x.cleanTot.due)}</td><td>${kpi(x.cleanTot.foto,x.cleanTot.done)}</td><td class="num"><b>${Object.keys(x.repo).length}</b></td></tr>`}).join('')}
  </tbody></table></div></section>`;
  ids.forEach(s=>{const x=D[s];
    out+=`<section class="panel"><div class="panel-h"><h2>${h(storeName(s))}</h2></div><div class="panel-b stack" style="gap:18px">`;
    // por função
    const fs=Object.entries(x.func);
    if(fs.length)out+=`<div><div class="label" style="margin-bottom:8px">Checklist por função</div><div class="kgrid">${fs.map(([f,v])=>`<div class="ktile"><span>${h(FUNCOES[f]||f)}</span><b>${pctTxt(v.done,v.exp)}</b>${meter(v.done,v.exp)}<small>${v.done} de ${v.exp} tarefas</small></div>`).join('')}</div></div>`;
    // por dia
    out+=`<div><div class="label" style="margin-bottom:8px">Checklist e produção por dia</div><div class="tablewrap"><table class="rel"><thead><tr><th>Dia</th><th>Checklist</th><th></th><th>Produção</th><th></th></tr></thead><tbody>${x.daily.map((d,i)=>{const p=x.prodDaily[i];const dow=new Date(d.d+'T00:00:00Z').getUTCDay();
      return `<tr><td class="when">${diaNome(dow).slice(0,3)} ${fmtDM(d.d)}</td><td style="min-width:120px">${meter(d.done,d.exp)}</td><td class="num">${d.has?pctTxt(d.done,d.exp):'<span class="muted">sem registros</span>'}</td><td style="min-width:120px">${p.exp?meter(p.done,p.exp):''}</td><td class="num">${p.exp?pctTxt(p.done,p.exp):'—'}</td></tr>`}).join('')}</tbody></table></div></div>`;
    out+=topList('Tarefas que mais ficaram sem fazer',x.missed,'dias',10);
    out+=topList('Produção: itens que mais ficaram sem fazer',x.prodMiss,'dias',10);
    const rp=Object.entries(x.repo).sort((p,q)=>q[1].vezes-p[1].vezes).slice(0,15);
    out+=`<div><div class="label" style="margin-bottom:8px">Reposição: itens mais pedidos</div>${rp.length?`<div class="tablewrap"><table class="rel"><thead><tr><th>Item</th><th>Dias pedido</th><th>Total pedido</th></tr></thead><tbody>${rp.map(([n,v])=>`<tr><td>${h(n)}</td><td class="num">${v.vezes}</td><td class="num">${v.soma?String(Math.round(v.soma*100)/100).replace('.',',')+(v.und?' '+h(v.und):''):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<span class="small muted">Nenhum pedido no período.</span>'}</div>`;
    const cl=Object.entries(x.clean).sort((p,q)=>p[0].localeCompare(q[0]));
    out+=`<div><div class="label" style="margin-bottom:8px">Limpeza semanal por funcionário</div>${cl.length?`<div class="tablewrap"><table class="rel"><thead><tr><th>Responsável</th><th>Limpezas</th><th>Feitas</th><th>No prazo</th><th>Com foto</th><th>Não feitas</th></tr></thead><tbody>${cl.map(([n,v])=>`<tr><td><b>${h(n)}</b></td><td class="num">${v.due}</td><td class="num">${v.done}</td><td class="num">${v.prazo}</td><td class="num">${v.foto}</td><td class="num">${v.due-v.done?`<span class="chip bad">${v.due-v.done}</span>`:'0'}</td></tr>`).join('')}</tbody></table></div>`:'<span class="small muted">Nenhuma limpeza vencida no período.</span>'}</div>`;
    const pp=Object.entries(x.people).sort((p,q)=>(q[1].tarefas+q[1].producao+q[1].reposicao+q[1].limpezas)-(p[1].tarefas+p[1].producao+p[1].reposicao+p[1].limpezas));
    out+=`<div><div class="label" style="margin-bottom:8px">O que cada funcionário marcou</div>${pp.length?`<div class="tablewrap"><table class="rel"><thead><tr><th>Funcionário</th><th>Tarefas</th><th>Produção</th><th>Reposição</th><th>Limpezas</th></tr></thead><tbody>${pp.map(([n,v])=>`<tr><td><b>${h(n)}</b></td><td class="num">${v.tarefas}</td><td class="num">${v.producao}</td><td class="num">${v.reposicao}</td><td class="num">${v.limpezas}</td></tr>`).join('')}</tbody></table></div>`:'<span class="small muted">Nenhuma marcação no período.</span>'}</div>`;
    out+=`</div></section>`;
  });
  return out+'</div>';
}
function kpi(a,b){return b?`<div class="kpi"><b>${pctTxt(a,b)}</b>${meter(a,b)}<small>${a} de ${b}</small></div>`:'<span class="muted">—</span>'}
function topList(title,obj,unit,n){const e=Object.entries(obj).sort((p,q)=>q[1]-p[1]).slice(0,n);return `<div><div class="label" style="margin-bottom:8px">${title}</div>${e.length?`<div class="tablewrap"><table class="rel"><tbody>${e.map(([k,v])=>`<tr><td>${h(k)}</td><td class="num" style="width:110px"><b>${v}</b> ${unit}</td></tr>`).join('')}</tbody></table></div>`:'<span class="small muted">Nada pendente no período.</span>'}</div>`}
function relRows(){const D=S.rel.data||{};const [a,b]=relRange();const L=[];const q=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const row=(...x)=>L.push(x.map(q).join(';'));
  row('Relatório Xis da Gaúcha',fmtDate(a)+' a '+fmtDate(b));L.push('');
  Object.keys(D).forEach(s=>{const x=D[s];row('LOJA',storeName(s));L.push('');
    row('Dia','Checklist feito','Checklist total','Checklist %','Produção feita','Produção total','Produção %');
    x.daily.forEach((d,i)=>{const p=x.prodDaily[i];row(fmtDate(d.d),d.done,d.exp,pctTxt(d.done,d.exp),p.done,p.exp,pctTxt(p.done,p.exp))});L.push('');
    row('Tarefa sem fazer','Dias');Object.entries(x.missed).sort((p,q)=>q[1]-p[1]).forEach(([k,v])=>row(k,v));L.push('');
    row('Produção sem fazer','Dias');Object.entries(x.prodMiss).sort((p,q)=>q[1]-p[1]).forEach(([k,v])=>row(k,v));L.push('');
    row('Item de reposição','Dias pedido','Total pedido','Unidade');Object.entries(x.repo).sort((p,q)=>q[1].vezes-p[1].vezes).forEach(([k,v])=>row(k,v.vezes,String(v.soma).replace('.',','),v.und));L.push('');
    row('Responsável limpeza','Limpezas','Feitas','No prazo','Com foto','Não feitas');Object.entries(x.clean).forEach(([k,v])=>row(k,v.due,v.done,v.prazo,v.foto,v.due-v.done));L.push('');
    row('Funcionário','Tarefas','Produção','Reposição','Limpezas');Object.entries(x.people).forEach(([k,v])=>row(k,v.tarefas,v.producao,v.reposicao,v.limpezas));L.push('');L.push('');
  });return L.join('\r\n')}

const SHEET_CSS=`.sheet{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.25;width:1080px;padding:18px 22px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet *{box-sizing:border-box}
.sheet .sh-top{display:flex;align-items:center;gap:18px;border:2px solid #1d6b34;border-radius:14px;padding:8px 16px;margin-bottom:8px}
.sheet .sh-top img{height:56px;width:auto}
.sheet .sh-top .tag{font-size:9px;font-weight:700;color:#1d6b34;letter-spacing:.04em;text-transform:uppercase}
.sheet h1{font-family:"Arial Black","Archivo Black",Arial,sans-serif;font-weight:900;font-size:22px;color:#1d6b34;margin:0;text-transform:uppercase;flex:1;text-align:center;letter-spacing:.01em}
.sheet .sh-meta{display:flex;gap:22px;font-size:11px;margin:0 0 8px;flex-wrap:wrap}
.sheet .sh-meta b{text-transform:uppercase;font-size:10px}
.sheet .line{display:inline-block;border-bottom:1px solid #111;min-width:150px;padding:0 4px}
.sheet table{width:100%;border-collapse:collapse;border:2px solid #1d6b34}
.sheet th{background:#1d6b34;color:#fff;font-size:9.5px;text-transform:uppercase;padding:6px 4px;border:1px solid #1d6b34;letter-spacing:.03em}
.sheet td{border:1px solid #9db8a3;padding:4px 6px;vertical-align:middle;height:25px}
.sheet td.dia{font-weight:800;text-align:center;background:#e9f3eb;text-transform:uppercase;font-size:11px;width:92px}
.sheet td.dia small{display:block;font-weight:600;color:#1d6b34;font-size:10px}
.sheet td.resp{font-weight:700;font-size:12px;width:110px}
.sheet td.w{width:62px}.sheet td.ck{width:30px}
.sheet td.c{width:22px;padding:0;text-align:center}
.sheet .mon{background:#dcdcdc}
.sheet tr.turno td{background:#2b2b2b;color:#fff;text-align:center;font-weight:700;height:20px;font-size:10px;letter-spacing:.06em}
.sheet td.at{white-space:nowrap;font-size:10.5px}
.sheet .sh-foot{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-weight:700;color:#1d6b34;font-size:11px;flex-wrap:wrap}
.sheet table.fol td.c{width:auto;min-width:16px;padding:0;text-align:center;font-weight:800;height:24px}
.sheet table.fol .dom{background:#28c850;color:#0e100e}
.sheet table.fol .sg{background:#dcdcdc}
.sheet table.fol th{padding:4px 2px}
.sheet table.fol th.dom{color:#0e100e}
.sheet table.fol td.niv{background:#fde7c9;color:#8a4a00}
.sheet table.fol th.sg{color:#333}
.sheet .sign{margin-top:14px;display:flex;gap:40px;font-size:11px}`;
function sheetHead(title,meta){return `<div class="sh-top"><div><img src="${LOGO_L}" alt="Xis da Gaúcha"><div class="tag">O autêntico xis gaúcho!</div></div><h1>${h(title)}</h1></div><div class="sh-meta">${meta}</div>`}
function sheetLimpeza(store,off,fn,tsel){fn=fn||'cozinha';tsel=tsel||'ambos';
  const c=S.cfg[store];const m=addDays(S.keys.week,7*off);const rot=rotation(store,weekIdx(m));
  const areas=sortAreas((c.areas||[]).filter(a=>fOf(a)===fn&&(tsel==='ambos'||matchTurno(a.turno,tsel))));const groups=[];
  areas.forEach(a=>{const g=groups[groups.length-1];if(g&&String(g.dia)===String(a.dia))g.list.push(a);else groups.push({dia:a.dia,list:[a]})});
  let rows='';
  groups.forEach(g=>{const dd=dataDoDia(g.dia);const d2=dd?addDays(dd,7*off):null;
    g.list.forEach((a,i)=>{rows+=`<tr>${i===0?`<td class="dia" rowspan="${g.list.length}">${diaNome(g.dia)}${d2?`<small>${fmtDM(d2)}</small>`:''}</td>`:''}<td><b>${h(a.name)}</b></td><td>${h(a.proc||'')}</td><td>${h(a.prod||'')}</td><td class="resp">${h(rot[a.id]||'')}</td><td class="w"></td><td class="ck"></td><td></td></tr>`})});
  return `<div class="sheet">${sheetHead('Planilha de limpeza semanal – '+(fn==='atendimento'?'Atendimento':'Cozinha'),`<span><b>Semana:</b> <span class="line">${fmtDate(m)} a ${fmtDate(addDays(m,6))}</span></span><span><b>Estabelecimento:</b> <span class="line">${h(storeName(store))}</span></span><span><b>Supervisão:</b> <span class="line"></span></span>`)}
  <table><thead><tr><th>Dia</th><th>Área / Equipamento</th><th>Procedimento</th><th>Produto</th><th>Responsável</th><th>Horário</th><th>✓</th><th>Observações</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="sh-foot"><span>Terminou a limpeza? Marque também no celular: Checklist → Minha limpeza da semana.</span><span>Conferência X · Higiene é qualidade!</span></div></div>`;
}
function sheetMensal(store,month,phase,tsel){tsel=tsel||'ambos';
  const c=S.cfg[store];const [y,mm]=month.split('-').map(Number);const nd=new Date(Date.UTC(y,mm,0)).getUTCDate();
  const days=[];for(let d=1;d<=nd;d++){const ds=month+'-'+String(d).padStart(2,'0');days.push({d,seg:new Date(ds+'T00:00:00Z').getUTCDay()===1})}
  const title=phase==='banheiro'?'Controle de higienização dos banheiros':phase==='salao'?'Controle de limpeza do salão':((PHASES.find(p=>p[0]===phase)||[])[1]||'');
  let rows='';

async function loadHist(){
  const H=S.hist;const date=H.date;
  try{
    const rows=[];
    for(const st of STORES){
      const s=st.id;
      const snap=await S.db.doc('days/'+s+'_'+date).get();
      if(snap.exists){const d=snap.data();
        Object.values(d.tasks||{}).forEach(r=>rows.push({store:s,turno:r.turno,tipo:'Tarefa',what:r.title+(r.val!=null&&r.val!==''?' ('+r.val+')':''),sit:r.done?'<span class="chip ok">Feito</span>':'<span class="chip">Desmarcado</span>',by:r.by,at:r.at}));
        Object.values(d.prod||{}).forEach(r=>rows.push({store:s,turno:'',tipo:'Produção',what:r.name+(r.meta?' (precisa ter '+r.meta+')':''),sit:[r.tem?'Tem '+h(r.tem):'',r.fazer?'Fazer '+h(fazerTxt(r.meta,r.fazer)):''].filter(Boolean).map(x=>'<span class="chip me">'+x+'</span>').join(' ')+' '+(r.ok?'<span class="chip ok">Feito</span>':'<span class="chip">Não feito</span>'),by:r.by,at:r.at}));
        Object.values(d.items||{}).forEach(r=>rows.push({store:s,turno:r.turno,tipo:'Reposição',what:r.name,sit:hasRec(r)?'<span class="chip me">'+[rTem(r)!==''?'Tem '+h(rTem(r)):'',rPrec(r)!==''?'Precisa '+h(rPrec(r)):''].filter(Boolean).join(' · ')+'</span>':'<span class="chip">Apagou a anotação</span>',by:r.by,at:r.at}));
      }
      const wsnap=await S.db.doc('weeks/'+s+'_'+mondayOf(date)).get();
      if(wsnap.exists){Object.entries(wsnap.data().areas||{}).forEach(([aid,r])=>{if(r.at&&bizDate(Date.parse(r.at))===date)rows.push({store:s,turno:'',tipo:'Limpeza',what:r.name+(r.resp&&r.resp!==r.by?' (rodízio: '+r.resp+')':''),sit:r.done?'<span class="chip ok">Limpo</span>'+(r.foto?' '+fotoBtn(s,mondayOf(date),aid):''):'<span class="chip">Desfeito</span>',by:r.by,at:r.at})})}
    }
    if(S.hist.date!==date)return;
    H.rows=rows;
    if(!H.summary){
      const days=[];for(let i=0;i<7;i++)days.push({date:addDays(S.keys.date,-i)});
      for(const st of STORES){
        const q=await S.db.collection('days').where('store','==',st.id).where('date','>=',addDays(S.keys.date,-6)).limit(20).get();
        q.docs.forEach(doc=>{const d=doc.data();const row=days.find(x=>x.date===d.date);if(!row)return;
          const c=S.cfg[st.id]||{};const total=turnosHoje(st.id,d.date).reduce((n,tn)=>n+(c.tasks||[]).filter(t=>tarefaDia(t,tn,st.id,d.date)).length,0);
          const done=Object.values(d.tasks||{}).filter(r=>r.done).length;
          const need=itemsLatest(d.items).filter(hasRec).length;
          row[st.id]={done,total,need}});
      }
      H.summary=days;
    }
  }catch(e){H.rows=[];toast('Não foi possível carregar o histórico.')}
  render();
}

function rotPeriodos(){const ym=S.keys.date.slice(0,7);return [['n4','Próximas 4 semanas'],['n8','Próximas 8 semanas'],['n12','Próximas 12 semanas'],...[0,1,2].map(i=>{const m=addMes(ym,i);return ['m'+m,MESES[+m.slice(5)-1]+' de '+m.slice(0,4)]})]}
function rotOffsets(per){if(per[0]==='m'){return semanasMes(per.slice(1)).filter(w=>w.slice(0,7)===per.slice(1)).map(w=>Math.round((Date.parse(w)-Date.parse(S.keys.week))/(7*864e5)))}const n=+per.slice(1)||4;return Array.from({length:n},(_,i)=>i)}
function rotPerLabel(per){const o=rotOffsets(per);const a=addDays(S.keys.week,7*o[0]),b=addDays(S.keys.week,7*o[o.length-1]+6);const p=rotPeriodos().find(x=>x[0]===per);return (p?p[1]:'Rodízio')+' · '+fmtDM(a)+' a '+fmtDM(b)}

async function backupExport(){
  S.bkMsg='Juntando os dados…';render();
  try{const docs={};
    const one=async p=>{const s=await S.db.doc(p).get();if(s.exists)docs[p]=s.data()};
    await one('config/lojas');await one('config/acesso');await one('acesso/pins');
    for(const st of STORES)await one('config/'+st.id);
    for(const col of ['days','weeks','fotos','folgas']){const q=await S.db.collection(col).limit(1000).get();q.docs.forEach(d=>{docs[col+'/'+d.id]=d.data()})}
    const dl=await claude.use('downloads');if(!dl){S.bkMsg='Este aparelho não permite baixar arquivos.';render();return}
    await dl.save({filename:'backup-conferencia-x-'+S.keys.date+'.json',data:JSON.stringify({app:'conferencia-x',versao:1,em:new Date().toISOString(),docs})});
    S.bkMsg='Backup baixado ('+Object.keys(docs).length+' registros).';render();
  }catch(e){S.bkMsg='Não foi possível fazer o backup.';render()}
}
async function backupImport(file){
  if(!file)return;S.bkMsg='Lendo o arquivo…';render();
  try{const j=JSON.parse(await file.text());if(!j||j.app!=='conferencia-x'||!j.docs)throw new Error('formato');
    const pri=p=>p.startsWith('config/')?0:p.startsWith('acesso/')?1:p.startsWith('folgas/')?2:3;
    const ent=Object.entries(j.docs).sort((a,b)=>pri(a[0])-pri(b[0]));let n=0;const falhas=[];
    const limpa=v=>{if(Array.isArray(v))return v.map(x=>Array.isArray(x)?{lista:x.map(limpa)}:limpa(x));if(v&&typeof v==='object'){const o={};for(const [k,x] of Object.entries(v)){if(k===''||x===undefined)continue;o[/^__.*__$/.test(k)?'_'+k:k]=limpa(x)}return o}return v};
    for(const [p,data] of ent){
      try{await S.db.doc(p).set(limpa(data));n++}
      catch(e){falhas.push(p);if(falhas.length===1)S.bkErro=(e&&(e.code||e.message))||'erro'}
      if((n+falhas.length)%10===0){S.bkMsg='Restaurando… '+(n+falhas.length)+' de '+ent.length;render()}
    }
    const conf=falhas.filter(p=>p.startsWith('config/')||p.startsWith('acesso/'));
    S.bkMsg=!n?'Nada foi restaurado. Este aparelho não está com a conta da gestora'+(window.CX_STANDALONE?' (toque em "Desconectar este aparelho" na tela de entrada e entre com o e-mail da gestora).':'.'):
      'Pronto: '+n+' de '+ent.length+' registros restaurados.'+(falhas.length?' Não entraram: '+falhas.length+(conf.length?' (incluindo '+conf.join(', ')+')':' (registros antigos ou fotos grandes demais)')+'.':'');
    S.edit=null;render();
  }catch(e){S.bkMsg=e&&e.message==='formato'?'Esse arquivo não é um backup do Conferência X.':'Não foi possível ler o arquivo de backup.';render()}
}

function pinNiver(e){const n=niverNorm(e&&e.niver);return n?n.slice(0,2)+n.slice(3,5):''}
async function pinsPorAniversario(onlyMissing){
  let salt=acc().salt;if(!salt){salt=newSalt();await writeAcc({salt})}
  const pinsPatch={};const sem=[];let n=0;
  for(const st of STORES){const c=S.cfg[st.id];if(!c||!(c.employees||[]).length)continue;let mud=false;
    const emps=[];for(const e of c.employees){const pin=pinNiver(e);
      if(pin&&!(onlyMissing&&e.pinHash)){emps.push(Object.assign({},e,{pinHash:await hashPin(salt,pin)}));pinsPatch[st.id+'_'+e.id]=pin;n++;mud=true}
      else{emps.push(e);if(!pin&&!onlyMissing)sem.push(e.name)}}
    if(mud)await S.db.doc('config/'+st.id).update({employees:emps})}
  if(n){const pref=S.db.doc('acesso/pins');try{await pref.update(pinsPatch)}catch(e){await pref.set(Object.assign({},S.pins||{},pinsPatch))}}
  return {n,sem}}
async function setPin(s,id,mode){
  if(S.dirty&&S.cfgStore===s){toast('Salve as outras alterações antes de mexer nos PINs.');return}
  let pin;
  if(mode==='gen'){pin=String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,'0')}
  else{pin=((document.getElementById('pin-'+s+'-'+id)||{}).value||'').trim();if(!/^[0-9]{4}$/.test(pin)){toast('O PIN precisa ter 4 números.');return}}
  const c=S.cfg[s];if(!c)return;let salt=acc().salt;
  try{
    if(!salt){salt=newSalt();await writeAcc({salt})}
    const hsh=await hashPin(salt,pin);
    const emps=(c.employees||[]).map(e=>e.id===id?Object.assign({},e,{pinHash:hsh}):e);
    await S.db.doc('config/'+s).update({employees:emps});
    const pref=S.db.doc('acesso/pins');const patch={[s+'_'+id]:pin};
    try{await pref.update(patch)}catch(e){await pref.set(Object.assign({},S.pins||{},patch))}
    S.edit=null;const e=(c.employees||[]).find(x=>x.id===id);toast('PIN de '+(e?e.name:'')+': '+pin);
  }catch(e){toast('Não foi possível salvar o PIN.')}
}

async function criarLoja(){
  const N=S.novaLoja;const name=((document.getElementById('nl-name')||{}).value||'').trim(),city=((document.getElementById('nl-city')||{}).value||'').trim();

  const turnos=N.turnos.split(',');const base=N.src?S.cfg[N.src]:null;const m=N.mods;
  const fixT=x=>{if(!x)return x;if(x.turno&&x.turno!=='todos'&&!turnos.includes(x.turno))x.turno=turnos.length===1?turnos[0]:'todos';return x};
  const cfg={turnos,employees:[],tasks:[],items:[],categories:[],areas:[],producao:[]};

    if(m.producao)cfg.producao=cp(base.producao).map(fixT);

    if(m.foto&&base.fotoLimpeza===false)cfg.fotoLimpeza=false;
  }
  try{

async function copyItems(){
  const to=(document.getElementById('copy-to')||{}).value;S.copyTo=to;const other=STORES.find(x=>x.id===to);if(!other)return;
  if(S.dirty){toast('Salve as alterações antes de copiar.');return}
  if(S.copyArm!==other.id){S.copyArm=other.id;toast('Toque de novo em "Copiar" para substituir a lista de '+other.name+'.');setTimeout(()=>{S.copyArm=null},5000);return}
  S.copyArm=null;
  const src=S.cfg[S.cfgStore];const dst=S.cfg[other.id];
  if(!src||!dst){toast('Loja sem configuração.');return}
  try{await S.db.doc('config/'+other.id).update({items:JSON.parse(JSON.stringify(src.items||[])),categories:catList(src)});toast('Lista copiada para '+other.name+'.')}
  catch(err){toast('Não foi possível copiar. Só a gestora pode alterar a configuração.')}
}
async function saveCfg(okMsg){
  const src0=S.edit._src;delete S.edit._src;const E=JSON.parse(JSON.stringify(S.edit));S.edit._src=src0;const s=E._store;delete E._store;delete E._src;
  E.employees=(E.employees||[]).filter(x=>x.name.trim()).map(x=>({...x,name:x.name.trim(),niver:niverNorm(x.niver)}));
  E.tasks=(E.tasks||[]).filter(x=>x.title.trim());E.items=(E.items||[]).filter(x=>x.name.trim());E.categories=catList(E);E.producao=(E.producao||[]).filter(x=>(x.name||'').trim());E.areas=(E.areas||[]).filter(x=>x.name.trim());
  E.employees=E.employees.map(x=>isGestorF(x)?Object.assign({},x,{turno:'todos',lider:false}):x);
  try{await S.db.doc('config/'+s).set(E);S.dirty=false;S.edit=null;toast(okMsg||'Configuração salva.');render()
    const gs=E.employees.filter(isGestorF);const exIds=(E.exFunc||[]).map(x=>x.id);
    for(const st of STORES){if(st.id===s)continue;const oc=S.cfg[st.id];if(!oc)continue;let mud=false;
      let emps=(oc.employees||[]).map(o=>{const g=gs.find(x=>x.id===o.id);if(g&&JSON.stringify(g)!==JSON.stringify(o)){mud=true;return Object.assign({},g)}return o});
      gs.forEach(g=>{if(!emps.some(o=>o.id===g.id)){emps.push(Object.assign({},g));mud=true}});
      const antes=emps.length;emps=emps.filter(o=>!(isGestorF(o)&&exIds.includes(o.id)));if(emps.length!==antes)mud=true;
      if(mud){try{await S.db.doc('config/'+st.id).update({employees:emps})}catch(e){}}}
    if(E.employees.some(e=>!e.pinHash&&pinNiver(e))){S.cfg[s]=E;pinsPorAniversario(true).then(r=>{if(r.n)toast(r.n===1?'PIN do aniversário criado para o funcionário novo.':r.n+' PINs criados pelo aniversário.')},()=>{})}}
  catch(err){toast('Não foi possível salvar. Só a gestora pode alterar a configuração.')}
}
